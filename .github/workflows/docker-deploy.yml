name: CI/CD Docker Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Display Commit SHA
        run: |
          echo "Commit SHA: $GITHUB_SHA"

      - name: Define Version (short SHA)
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Deploying version ${VERSION}"

      - name: Build Docker Image with Compose
        run: |
          echo "Building image rehanalimahomed/amadiy-ocr:${VERSION} (and :latest)"
          docker compose -f docker-compose.yml build --pull \
            --build-arg BUILD_ID="${{ github.sha }}" app
          docker tag v2-ocr-app:latest rehanalimahomed/amadiy-ocr:${VERSION}
          docker tag v2-ocr-app:latest rehanalimahomed/amadiy-ocr:latest

      - name: Push Docker Image to Docker Hub
        run: |
          docker push rehanalimahomed/amadiy-ocr:${VERSION}
          docker push rehanalimahomed/amadiy-ocr:latest

      - name: Deploy New Container (by exact version)
        run: |
          set -e
          CONTAINER_NAME="amadiy-ocr"
          IMAGE="rehanalimahomed/amadiy-ocr:${VERSION}"
          echo "Removing old container if it exists..."
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          echo "Starting ${CONTAINER_NAME} from ${IMAGE} on port 3000..."
          docker run -d --restart always \
            --name "${CONTAINER_NAME}" \
            -p 3000:3000 \
            "${IMAGE}"
          echo "Verifying container status..."
          sleep 3
          docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
